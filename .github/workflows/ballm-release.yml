name: ballm-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example 2.2.5-ballm.1"
        required: true

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: windows-latest
            target: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install
      - run: bun run --cwd packages/cli build
      - uses: actions/upload-artifact@v4
        with:
          name: ballm-cli-${{ matrix.target }}
          path: packages/cli/dist/**

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install
      - run: bun run --cwd packages/desktop build
        env:
          # TODO(ballm): replace with the internal signing and notarization secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ballm-desktop-${{ matrix.target }}
          path: packages/desktop/dist/**
