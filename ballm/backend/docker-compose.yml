name: ballm-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ballm
      POSTGRES_PASSWORD: ballm
      POSTGRES_DB: ballm
    ports:
      - "127.0.0.1:${BALLM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballm -d ballm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${BALLM_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    user: "0:0"  # local compose only; Kubernetes runs as non-root
    build:
      context: .
      args:
        SERVICE: control-plane
    command: ["bun", "run", "packages/platform/src/db/cli.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://ballm:ballm@postgres:5432/ballm
      BALLM_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      BALLM_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    user: "0:0"  # local compose only; Kubernetes runs as non-root
    build:
      context: .
      args:
        SERVICE: control-plane
    env_file: .env
    environment:
      DATABASE_URL: postgres://ballm:ballm@postgres:5432/ballm
      REDIS_URL: redis://redis:6379
      BALLM_MIGRATE_ON_START: "0"
      BALLM_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt-private.pem
      BALLM_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
    ports:
      - "127.0.0.1:${BALLM_CONTROL_PORT:-8787}:8787"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  gateway:
    user: "0:0"  # local compose only; Kubernetes runs as non-root
    build:
      context: .
      args:
        SERVICE: gateway
    env_file: .env
    environment:
      DATABASE_URL: postgres://ballm:ballm@postgres:5432/ballm
      REDIS_URL: redis://redis:6379
      BALLM_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt-public.pem
      BALLM_JWKS_URL: http://control-plane:8787/.well-known/jwks.json
      BALLM_GATEWAY_PORT: "8788"
    ports:
      - "127.0.0.1:${BALLM_GATEWAY_PORT:-8788}:8788"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      control-plane:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  postgres-data:
