apiVersion: v1
kind: Service
metadata:
  name: {{ include "ballm.fullname" . }}-control-plane
  labels:
    {{- include "ballm.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      port: {{ .Values.controlPlane.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ballm.fullname" . }}-gateway
  labels:
    {{- include "ballm.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
